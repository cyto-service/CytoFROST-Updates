name: Publish signed update channel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions: {}

concurrency:
  group: signed-update-channel
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: update-signing
    steps:
      - name: Check out channel repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          test -n "$tag"
          mkdir -p .update-tmp
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > .update-tmp/release.json
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir .update-tmp
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "CytoFROST-Setup-*-x64.msi" --dir .update-tmp
          installer_count="$(find .update-tmp -maxdepth 1 -type f -name 'CytoFROST-Setup-*-x64.msi' | wc -l | tr -d ' ')"
          test "$installer_count" = "1"
          (cd .update-tmp && sha256sum --check SHA256SUMS.txt --ignore-missing --strict)
          if [[ -n "${INPUT_CHANNEL:-}" ]]; then
            channel="$INPUT_CHANNEL"
          elif jq -e '.prerelease == true' .update-tmp/release.json >/dev/null; then
            channel="preview"
          else
            channel="stable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Generate and sign manifest
        env:
          RELEASE_JSON_PATH: .update-tmp/release.json
          CHECKSUMS_PATH: .update-tmp/SHA256SUMS.txt
          UPDATE_CHANNEL: ${{ steps.release.outputs.channel }}
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
          UPDATE_OUTPUT_DIRECTORY: signed-channel
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-manifest.mjs
          if [[ "$UPDATE_CHANNEL" == "stable" ]]; then
            UPDATE_CHANNEL=preview node scripts/publish-manifest.mjs
          fi

      - name: Transfer signed channel files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-update-channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-channel/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out channel repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Receive signed channel files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-update-channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-channel

      - name: Commit channel update
        shell: bash
        run: |
          set -euo pipefail
          cp signed-channel/*.json channels/
          cp signed-channel/*.sig channels/
          git add channels
          if git diff --cached --quiet; then
            echo "Channel already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish signed update manifest"
          git push
